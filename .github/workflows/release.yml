name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          uv run --no-dev gk3hd package verify
          uv build
          uv publish
