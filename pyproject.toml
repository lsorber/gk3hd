[project]
name = "gk3hd"
version = "1.0.0"
description = "Modern high-resolution graphics for Gabriel Knight 3"
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = "MIT"
authors = [{ name = "Laurent Sorber" }]
keywords = ["gabriel-knight-3", "modding", "upscaling", "widescreen"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "lzokay>=2.1,<3",
  "pillow>=12.3.0",
  "typer>=0.27.2",
]

[project.optional-dependencies]
upscale = [
  "diffusers>=0.40",
  "einops>=0.8.1",
  "freetype-py==2.5.1",
  "huggingface-hub>=0.34",
  "numpy>=2.3",
  "rotary-embedding-torch>=0.5.3",
  "safetensors>=0.6",
  "scipy>=1.16",
  "torch>=2.8",
]

[project.scripts]
gk3hd = "gk3hd.cli:app"

[project.urls]
Changelog = "https://github.com/lsorber/gk3hd/releases"
Issues = "https://github.com/lsorber/gk3hd/issues"
Repository = "https://github.com/lsorber/gk3hd"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "capstone>=5.0.6",
  "codespell>=2.4.3",
  "commitizen>=4.9",
  "coverage>=7.10",
  "numpy>=2.3",
  "poethepoet>=0.38",
  "pytest>=9.0",
  "ruff>=0.16.8",
  "scipy>=1.16",
  "ty>=0.0.82",
  "unicorn>=2.1.4",
  "windows-capture>=2.0.1; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
extend-exclude = ["src/gk3hd/textures/_vendor"]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY", "D203", "D213", "FIX", "PD008", "PD009", "TD003"]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.per-file-ignores]
# Typer discovers a command's flat option schema from its Python signature.
"src/gk3hd/cli/*.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
# Native-code builders deliberately expose complete named ABI inputs and keep
# branch-local instruction emission together. Splitting those emitters to meet
# generic Python complexity limits would obscure the byte contract verified by
# the patch specifications.
"src/gk3hd/patch/definitions/**/*.py" = [
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
# Pytest assertions, private invariant inspection, measured binary constants,
# and parametrized booleans are executable specifications rather than API code.
"tests/**/*.py" = ["D", "FBT001", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-platform = "all"

[tool.ty.analysis]
# AI imports resolve when the extra is present; native capture resolves on
# Windows. The base-only Linux CI job can still check portable code.
allowed-unresolved-imports = [
  "freetype.**",
  "huggingface_hub.**",
  "safetensors.**",
  "torch.**",
  "windows_capture",
]

[tool.ty.src]
exclude = ["src/gk3hd/textures/_vendor"]

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "acceptance: uses a private local GK3 installation or full texture corpus",
  "integration: exercises multiple production components",
  "visual: opt-in live-game screenshots and interaction checks",
  "slow: representative reconstruction and native-emulation checks, enabled with --slow",
  "windows: requires Windows capture or operating-system APIs",
]
xfail_strict = true

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["gk3hd"]
omit = ["src/gk3hd/textures/_vendor/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.codespell]
ignore-words-list = "lod,seh,tre"
skip = "./docs,./build,./dist,./src/gk3hd/assets/FACES.TXT,./src/gk3hd/assets/texture-policy.json,./src/gk3hd/textures/_vendor,./src/gk3hd/renderer/renderer.patch,./uv.lock"

[tool.commitizen]
version_provider = "uv"
tag_format = "v$version"
bump_message = "bump: v$current_version → v$new_version"
update_changelog_on_bump = true
changelog_incremental = true

[tool.poe.tasks]
format = "ruff format ."
lint = [
  { cmd = "ruff format --check ." },
  { cmd = "ruff check ." },
  { cmd = "ty check" },
  { cmd = "codespell ." },
]
visual = { cmd = "pytest tests/visual --visual", help = "Opt-in visual comparisons (small=12, medium=25, large=100)" }
test = { cmd = "pytest", help = "Fast tests; add --slow to include reconstruction and native emulation" }

[tool.poe.tasks.coverage]
sequence = [
  { cmd = "coverage erase" },
  { cmd = "coverage run -m pytest --slow" },
  { cmd = "coverage combine" },
  { cmd = "coverage report" },
]
